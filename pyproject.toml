[project]
name = "qnas-torch"
version = "0.1.0"
description = "QNAS implementation in PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "scikit-learn==1.3.2",
    "PyYAML==6.0.1",
    "tqdm==4.66.1",
    "seaborn==0.13.0",
    "matplotlib==3.8.1",
    "medmnist==3.0.1",
    "fvcore==0.1.5.post20221221",
    "nvidia-ml-py",
    "ray",
    "gputil",
    "rich",
    "orjson",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ is the import root (flat imports like `import qnas`), not an installed package.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: full evolve() runs against a fake evaluator (deselect with -m 'not e2e')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cifar10_data", "experiment_*", ".qnas_queue"]

[tool.ruff.lint]
# Correctness-focused only: pyflakes + the pycodestyle error subset + bugbear's
# mutable-default / raise-from checks. Style rules are intentionally off so the
# linter flags bugs, not the legacy formatting of the research code.
select = ["E4", "E7", "E9", "F", "B006", "B904"]
ignore = [
    "E741",  # ambiguous variable name (`l`) - pre-existing, harmless
    "E721",  # `type(x) is list` comparisons in qnas_config.py are deliberate
]

[tool.ruff.lint.per-file-ignores]
# Legacy error handling in the atleta dataset branch (bare except, mutable default `info`);
# fixing them changes behavior, so they are grandfathered rather than silently rewritten.
"src/cnn/input.py" = ["B006", "E722", "B904"]
"tests/*" = ["F811"]  # pytest fixtures are re-declared as test arguments
