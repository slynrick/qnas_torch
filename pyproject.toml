[project]
name = "qnas-torch"
version = "0.1.0"
description = "QNAS implementation in PyTorch"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas",
    "scikit-learn==1.3.2",
    "PyYAML==6.0.1",
    "tqdm==4.66.1",
    "seaborn==0.13.0",
    "matplotlib==3.8.1",
    "medmnist==3.0.1",
    "fvcore==0.1.5.post20221221",
    "nvidia-ml-py",
    "ray",
    "gputil",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
torchaudio = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
