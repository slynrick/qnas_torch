# Configuration file: MixedOperation (DARTS-style PDF) mode + alpha-based weight reuse

QNAS:
    crossover_rate: 0.5
    max_generations: 100
    max_num_nodes: 20
    num_quantum_ind: 4
    penalize_number: 3
    repetition: 1
    replace_method: best
    update_quantum_gen: 5
    update_quantum_rate: 0.1
    save_data_freq: 1
    crossover_frequency: 5
    pop_crossover_rate: 0.4 # offspring replacement proportion in the population
    pop_crossover_method: hux # hux, uniform
    patience: 60

    # MixedOperation mode: quantum representation is a PDF over alpha logits
    # instead of a PMF used for discrete sampling.
    mixedop_mode: True
    alpha_noise_std: 0.1

    # P-DARTS-style progressive depth growth + operation pruning: 3 stages over
    # max_generations: 100, final stage matches max_num_nodes (20). Op pruning
    # ranks candidates by mean trained softmax(alpha) weight at each transition.
    progressive_stages:
      - {gen_start: 0,  num_nodes: 7,  num_ops: 11}
      - {gen_start: 33, num_nodes: 13, num_ops: 7}
      - {gen_start: 66, num_nodes: 20, num_ops: 4}

    params_ranges:
        decay: 0.9
        learning_rate: 0.001
        momentum: 0.0
        weight_decay: 1.0e-4

    function_dict:  {'conv_1_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_1_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 1, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_128': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 128}, 'prob': 1.0/3.0/8.0},
                     'conv_3_1_256': {'function': 'ConvBlock', 'params': {'kernel': 3, 'strides': 1, 'filters': 256}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_32':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 32}, 'prob': 1.0/3.0/8.0},
                     'conv_5_1_64':  {'function': 'ConvBlock', 'params': {'kernel': 5, 'strides': 1, 'filters': 64}, 'prob': 1.0/3.0/8.0},
                     'max_pool_2_2': {'function': 'MaxPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'avg_pool_2_2': {'function': 'AvgPooling', 'params': {'kernel': 2, 'strides': 2}, 'prob': 1.0/3.0/2.0},
                     'no_op':        {'function': 'NoOp', 'params': {}, 'prob': 1.0/3.0}}

train:
    batch_size: 256
    eval_batch_size: 256
    max_epochs: 50
    epochs_to_eval: 5

    # Per-individual training early stopping: stop one model's training once its
    # validation loss stops improving, instead of always running max_epochs. With
    # this enabled, validation runs every epoch (not just the last epochs_to_eval).
    early_stopping_enabled: True
    early_stopping_patience: 5
    early_stopping_min_delta: 0.05
    optimizer: AdamW
    fitness_metric: best_loss
    mo_metric_base: loss
    mixed_precision: True
    available_gpus: [0] # gpu0, gpu1, gpu2 [0, 1, 2]
    device: cuda:0

    # Dataset
    dataset: Cifar10
    data_augmentation: False
    subtract_mean: True
    limit_data: True
    limit_data_value: 10000
    num_workers: 4

    # Tensorflow
    save_checkpoints_epochs: 5
    save_summary_epochs: 0.25
    threads: 2

    # penalization parameters - scalarized fitness
    max_params: 114090 # 1.9M
    max_inference_time: 1000 # us

    # Network structure Configuration
    network_config: default
    network_gap: False

    # Caps MixedOp's per-node canonical channel width instead of following
    # the largest conv in function_dict (conv_3_1_256) - see mixed_model.py.
    mixedop_max_channels: 64

    # Fitness cache: closest already-evaluated architecture is found by comparing
    # alpha weight vectors (cosine distance); on a hit, its fitness/params/inference
    # time are reused directly and training is skipped entirely.
    weight_reuse_enabled: True
    weight_bank_dir: ""
    cosine_threshold: 0.05
